name: Publish multi-contest teaching site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: teaching-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify reviewed file set and prepare web-only artifact
        env:
          REVIEWED_RELEASE_SHA256: ${{ vars.REVIEWED_RELEASE_SHA256 }}
          PRIOR_PUBLISHED_EDITIONS: ${{ vars.PRIOR_PUBLISHED_EDITIONS }}
        run: node verify-release.mjs --release --expect="$REVIEWED_RELEASE_SHA256" --prior-editions="$PRIOR_PUBLISHED_EDITIONS" --out=_site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload verified teaching artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy verified version
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
